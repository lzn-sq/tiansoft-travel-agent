services:
  backend:
    build: ./backend
    container_name: tiansoft-agent-backend
    env_file:
      - ./backend/.env
    environment:
      - DATABASE_URL=sqlite+aiosqlite:////app/data/agent.db
      - CHROMA_DIR=/app/chroma_db
      - CORS_ORIGINS=http://localhost,http://localhost:5173,http://127.0.0.1
    ports:
      - "8000:8000"
    volumes:
      - backend_data:/app/data
      - chroma_data:/app/chroma_db
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: ""
    container_name: tiansoft-agent-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  backend_data:
  chroma_data:
