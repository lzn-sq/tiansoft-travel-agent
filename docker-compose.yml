services:
  backend:
    build: ./backend
    container_name: tiansoft-agent-backend
    env_file:
      - ./backend/.env
    ports:
      - "8000:8000"
    volumes:
      - ./backend/agent.db:/app/agent.db
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: tiansoft-agent-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped
