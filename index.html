<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>天软差旅合规审查 Agent</title>
    <style>
        :root {
            --bg-main: #343541;
            --bg-chat: #444654;
            --bg-input: #40414f;
            --text-primary: #ececf1;
            --text-secondary: #c5c5d2;
            --accent-color: #10a37f;
            --border-color: #4d4d4f;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; 
            background-color: var(--bg-main); 
            color: var(--text-primary); 
            height: 100vh; 
            display: flex; 
            justify-content: center; 
            overflow: hidden;
        }

        .chat-container { 
            width: 100%; 
            max-width: 850px; 
            display: flex; 
            flex-direction: column; 
            height: 100vh; 
            position: relative;
        }

        .header { 
            padding: 15px 20px; 
            text-align: center; 
            font-size: 16px; 
            font-weight: 600; 
            border-bottom: 1px solid var(--border-color);
            background-color: var(--bg-main);
            position: sticky;
            top: 0;
            z-index: 10;
        }

        .chat-box { 
            flex: 1; 
            padding: 20px 20px 120px 20px;
            overflow-y: auto; 
            display: flex; 
            flex-direction: column; 
            gap: 20px; 
            scroll-behavior: smooth;
        }

        .chat-box::-webkit-scrollbar { width: 8px; }
        .chat-box::-webkit-scrollbar-track { background: transparent; }
        .chat-box::-webkit-scrollbar-thumb { background: #565869; border-radius: 4px; }

        .message-wrapper {
            display: flex;
            gap: 15px;
            max-width: 90%;
        }
        .message-wrapper.user-wrapper { align-self: flex-end; flex-direction: row-reverse; }
        .message-wrapper.bot-wrapper { align-self: flex-start; }

        .avatar {
            width: 32px;
            height: 32px;
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            flex-shrink: 0;
        }
        .avatar.user { background-color: #5c5c72; color: white; }
        .avatar.bot { background-color: var(--accent-color); color: white; }

        .message { 
            padding: 12px 18px; 
            border-radius: 8px; 
            line-height: 1.6; 
            font-size: 15px; 
            word-wrap: break-word; 
            white-space: pre-wrap;
        }
        .user-message { background-color: var(--bg-main); border: 1px solid var(--border-color); }
        .bot-message { background-color: var(--bg-chat); }

        .input-container {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            padding: 20px;
            background-image: linear-gradient(180deg, transparent, var(--bg-main) 50%);
        }

        .input-box {
            display: flex;
            align-items: flex-end;
            background-color: var(--bg-input);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 10px;
            box-shadow: 0 0 15px rgba(0,0,0,0.1);
            transition: border-color 0.3s;
        }
        
        .input-box:focus-within { border-color: var(--accent-color); }

        textarea { 
            flex: 1; 
            background: transparent;
            border: none;
            color: var(--text-primary);
            font-size: 15px;
            font-family: inherit;
            resize: none;
            outline: none;
            max-height: 150px;
            padding: 5px;
            line-height: 1.5;
            overflow-y: auto;
        }
        
        textarea::placeholder { color: #8e8ea0; }

        button { 
            background-color: var(--accent-color); 
            color: white; 
            border: none; 
            border-radius: 8px; 
            padding: 8px 15px; 
            cursor: pointer; 
            font-weight: 600;
            margin-left: 10px;
            height: 36px;
            transition: background-color 0.2s, opacity 0.2s;
        }
        
        button:hover:not(:disabled) { background-color: #1a7f64; }
        button:disabled { background-color: #555; opacity: 0.7; cursor: not-allowed; }

        .footer-text {
            text-align: center;
            font-size: 12px;
            color: var(--text-secondary);
            margin-top: 10px;
        }

        .cursor-blink::after { 
            content: '▍'; 
            animation: blink 1s step-start infinite; 
            color: var(--accent-color); 
            display: inline-block;
            vertical-align: bottom;
        }
        @keyframes blink { 50% { opacity: 0; } }
        
        strong { color: #ffffff; } /* 加粗字体更亮 */
    </style>
</head>
<body>

<div class="chat-container">
    <div class="header">✈️ 天软差旅合规审查 Agent</div>
    
    <div class="chat-box" id="chatBox">
        <!-- 欢迎语 -->
        <div class="message-wrapper bot-wrapper">
            <div class="avatar bot">AI</div>
            <div class="message bot-message">你好！我是天软财务审核员。请告诉我你的出差城市、各项花费明细，我来帮你判断是否合规。</div>
        </div>
    </div>

    <div class="input-container">
        <div class="input-box">
            <textarea id="userInput" rows="1" placeholder="例如：我是部门经理，去北京出差 3 天，机票 1200，住宿 3 晚共 2400，打车 150。帮我算算合规吗？" onkeypress="handleKeyPress(event)" oninput="autoResize(this)"></textarea>
            <button id="sendBtn" onclick="sendMessage()">发送</button>
        </div>
        <div class="footer-text">天软实战优才项目 · 智能体应用演示</div>
    </div>
</div>

<script>
    const chatBox = document.getElementById('chatBox');
    const userInput = document.getElementById('userInput');
    const sendBtn = document.getElementById('sendBtn');
    
    let chatHistory = []; 

    function handleKeyPress(event) {
        if (event.key === 'Enter' && !event.shiftKey && !userInput.disabled) {
            event.preventDefault(); 
            sendMessage(); 
        }
    }

    function autoResize(textarea) {
        textarea.style.height = 'auto';
        textarea.style.height = (textarea.scrollHeight) + 'px';
    }

    function appendMessage(role, text) {
        const wrapper = document.createElement('div');
        wrapper.className = `message-wrapper ${role}-wrapper`;
        
        const avatar = document.createElement('div');
        avatar.className = `avatar ${role}`;
        avatar.innerText = role === 'user' ? '我' : 'AI';
        
        const msgDiv = document.createElement('div');
        msgDiv.className = `message ${role}-message`;
        msgDiv.innerHTML = text;
        
        wrapper.appendChild(avatar);
        wrapper.appendChild(msgDiv);
        chatBox.appendChild(wrapper);
        
        chatBox.scrollTop = chatBox.scrollHeight;
        return msgDiv; 
    }

    async function sendMessage() {
        const text = userInput.value.trim();
        if (!text) return;

        userInput.value = '';
        userInput.style.height = 'auto'; 
        appendMessage('user', text.replace(/\n/g, '<br>'));
        
        userInput.disabled = true;
        sendBtn.disabled = true;
        sendBtn.innerText = '思考中...';
        
        const botMsgDiv = appendMessage('bot', '');
        botMsgDiv.classList.add('cursor-blink');
        
        let fullReply = ""; 
        let sseBuffer = ""; 

        try {
            const response = await fetch('/chat/stream', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ text: text, history: chatHistory })
            });
            
            if (!response.ok) throw new Error("网络异常或服务器宕机");
            
            const reader = response.body.getReader();
            const decoder = new TextDecoder("utf-8");

            while (true) {
                const { done, value } = await reader.read();
                if (done) break;
                
                const chunk = decoder.decode(value, { stream: true });
                sseBuffer += chunk;

                const parts = sseBuffer.split('\n\n');
                sseBuffer = parts.pop(); 

                for (const part of parts) {
                    if (part.startsWith('data: ')) {
                        const textChunk = part.replace('data: ', '');
                        fullReply += textChunk;
                        
                        // 1. 把 **文本** 替换成粗体
                        let formattedReply = fullReply.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
                        // 2. 把换行符替换为 <br>
                        botMsgDiv.innerHTML = formattedReply.replace(/\n/g, '<br>');
                        
                        chatBox.scrollTop = chatBox.scrollHeight;
                    }
                }
            }

            botMsgDiv.classList.remove('cursor-blink');

            chatHistory.push({ role: "user", content: text });
            chatHistory.push({ role: "assistant", content: fullReply });

        } catch (error) {
            botMsgDiv.classList.remove('cursor-blink');
            botMsgDiv.innerHTML = `<span style="color: #ff6b6b;">⚠️ 请求失败：${error.message}，请刷新重试。</span>`;
        } finally {
            userInput.disabled = false;
            sendBtn.disabled = false;
            sendBtn.innerText = '发送';
            userInput.focus();
        }
    }
</script>

</body>
</html>
