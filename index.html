<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>天软差旅合规 Agent</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f7f6; display: flex; justify-content: center; padding-top: 50px; margin: 0; }
        .chat-container { width: 650px; background: white; border-radius: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); overflow: hidden; display: flex; flex-direction: column; height: 750px; }
        .header { background: #0056b3; color: white; padding: 15px; text-align: center; font-size: 18px; font-weight: bold; letter-spacing: 1px;}
        .chat-box { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 15px; }
        .message { max-width: 85%; padding: 10px 15px; border-radius: 10px; line-height: 1.6; font-size: 14px; word-wrap: break-word;}
        .user-message { background: #e3f2fd; align-self: flex-end; border-bottom-right-radius: 0; }
        .bot-message { background: #f1f1f1; align-self: flex-start; border-bottom-left-radius: 0; }
        .input-area { display: flex; padding: 15px; border-top: 1px solid #ddd; background: #fafafa; }
        input[type="text"] { flex: 1; padding: 12px; border: 1px solid #ccc; border-radius: 20px; outline: none; font-size: 14px; transition: border 0.3s;}
        input[type="text"]:focus { border-color: #0056b3; }
        button { margin-left: 10px; padding: 10px 25px; background: #0056b3; color: white; border: none; border-radius: 20px; cursor: pointer; font-size: 14px; transition: background 0.3s;}
        button:hover { background: #004494; }
        button:disabled { background: #999; cursor: not-allowed; }
        .loading { color: #888; font-style: italic; font-size: 13px; }
    </style>
</head>
<body>

<div class="chat-container">
    <div class="header">✈️ 天软差旅合规审核 Agent</div>
    <div class="chat-box" id="chatBox">
        <!-- 初始欢迎语 -->
        <div class="message bot-message">你好！我是天软财务审核员。请告诉我你的出差城市、各项花费金额，我来帮你算算能不能报销。</div>
    </div>
    <div class="input-area">
        <input type="text" id="userInput" placeholder="例如：我去北京出差，住宿两晚800，打车120，能报销吗？" onkeypress="handleKeyPress(event)">
        <button id="sendBtn" onclick="sendMessage()">发送</button>
    </div>
</div>

<script>
    const chatBox = document.getElementById('chatBox');
    const userInput = document.getElementById('userInput');
    const sendBtn = document.getElementById('sendBtn');
    
    // 核心：新建一个数组，用来记录对话历史
    let chatHistory = []; 

    function handleKeyPress(event) {
        if (event.key === 'Enter') { sendMessage(); }
    }

    async function sendMessage() {
        const text = userInput.value.trim();
        if (!text) return;

        // 1. 显示用户消息
        addMessage(text, 'user-message');
        userInput.value = '';
        
        // 2. 锁定输入框，防止用户连续点击
        userInput.disabled = true;
        sendBtn.disabled = true;
        const loadingDiv = addMessage("正在思考并查询制度中，请稍候...", 'bot-message loading');

        try {
            // 3. 发送请求（带上 chatHistory）
            const response = await fetch('/chat', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ 
                    text: text,
                    history: chatHistory // 把历史发给后端
                })
            });
            
            if (!response.ok) throw new Error("服务器响应错误");
            
            const data = await response.json();
            const botReply = data.reply;
            
            // 4. 替换加载框为真正的 Agent 回答
            loadingDiv.classList.remove('loading');
            // 把换行符替换为 HTML 换行标签，保持格式美观
            loadingDiv.innerHTML = botReply.replace(/\n/g, '<br>');

            // 5. 【关键】：把这轮对话存入历史记录，供下次多轮对话使用
            chatHistory.push({ role: "user", content: text });
            chatHistory.push({ role: "assistant", content: botReply });

        } catch (error) {
            loadingDiv.classList.remove('loading');
            loadingDiv.innerText = "⚠️ 出错了：" + error.message;
            loadingDiv.style.color = "red";
        } finally {
            // 6. 解锁输入框，恢复焦点，自动滚动到底部
            userInput.disabled = false;
            sendBtn.disabled = false;
            userInput.focus();
            chatBox.scrollTop = chatBox.scrollHeight;
        }
    }

    // 辅助函数：在聊天框添加一个消息气泡
    function addMessage(text, className) {
        const div = document.createElement('div');
        div.className = `message ${className}`;
        div.innerText = text;
        chatBox.appendChild(div);
        chatBox.scrollTop = chatBox.scrollHeight;
        return div;
    }
</script>

</body>
</html>
